name: LLM Evaluation CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]

jobs:
  # STAGE 1: Fast Calibration Gate (Pre-flight Check)
  judge-calibration-gate:
    name: 🛡️ Stage 1 - Judge Calibration Gate (Cohen's Kappa)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Judge Calibration Gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Execute calibration suite and verify Cohen's Kappa (κ >= 0.80)
          pytest -m calibration -s

  # STAGE 2: Parallel Scenario Evaluation (Executes ONLY if Stage 1 Passes)
  scenario-evaluation:
    name: 🧪 Stage 2 - Parallel Layer A & Layer B Scenario Evals
    needs: judge-calibration-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Execute Scenario Evals Suite in Parallel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Runs Layer A & B scenario evaluations using all available runner CPU cores
          pytest -m evals -n auto --html=reports/report.html --self-contained-html --junitxml=reports/report.xml

      # STAGE 3: Publish Reports & Artifacts
      - name: Upload Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-reports
          path: reports/
          retention-days: 14

      - name: Generate PR Job Summary
        if: always()
        run: |
          echo "### 📊 LLM Evaluation Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage 1 (Calibration Gate):** PASSED (Cohen's Kappa $\kappa \ge 0.80$)" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage 2 (Scenario Suite):** Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **HTML & JUnit Reports:** Uploaded as artifact llm-eval-reports" >> $GITHUB_STEP_SUMMARY