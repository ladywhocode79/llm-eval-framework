[pytest]
testpaths = evals/tests
markers =
    eval: LLM evaluation tests (run with: pytest -m eval)
    calibration: Verification of LLM Judge alignment against Human Gold Set (Cohens Kappa)
    evals: Layer A and Layer B scenario evaluation tests
    benchmark: Comparative cost, latency, and accuracy benchmark
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
addopts = --html=reports/report.html --self-contained-html --junitxml=reports/report.xml
