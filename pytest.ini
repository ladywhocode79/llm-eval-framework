[pytest]
testpaths = evals/tests

# Folder path resolution
pythonpath = evals/tests .

markers =
    eval: LLM evaluation tests (run with: pytest -m eval)

asyncio_mode = auto

# Live logging configuration
log_cli = true
log_cli_level = INFO

# Combined options: Parallel execution + Report generation
addopts = -n auto --dist loadscope --html=reports/report.html --self-contained-html --junitxml=reports/report.xml